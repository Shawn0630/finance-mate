services:
  app:
    build: .
    ports:
      - "9200:9200"
    # The project-root .env (gitignored — see .env.example) carries
    # runtime configuration such as the AI Fill LLM key; optional,
    # the app runs without it.
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "9200"
      DATA_DIR: /app/data
      # The seed credentials are only used on the very first start, when the
      # users table is still empty. Change the password before real use.
      # SEED_ADMIN_USER: admin
      # SEED_ADMIN_PASSWORD: admin
    volumes:
      - finance-mate-data:/app/data
      # iCloud sync (optional): bind-mount a folder in the Mac's iCloud
      # Drive to /app/data/sync, then enable sync on the Admin page.
      # The folder must exist on the Mac first:
      #   mkdir -p ~/Library/Mobile\ Documents/com~apple~CloudDocs/FinanceMate
      # then uncomment the line below (Docker Compose expands ${HOME}):
      # - ${HOME}/Library/Mobile Documents/com~apple~CloudDocs/FinanceMate:/app/data/sync
    restart: unless-stopped

volumes:
  finance-mate-data:
